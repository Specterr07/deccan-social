# CI: every pull request must typecheck, lint and build; the Docker image is built only when files that affect it change.
# No run on push to main: a squash-merged, green PR adds nothing new (ADR-016). T-09 adds a main trigger for the deploy job only.
# See docs/CICD.md.
name: CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decides whether the slow Docker job is needed: only when a file that goes into the image changes.
  # The job still exists and reports "skipped", which satisfies branch protection (unlike workflow-level paths-ignore,
  # which would leave the required checks missing and block the merge).
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # No usable base commit: assume the image changed and build it.
          if [ -z "$BASE_SHA" ] || ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            echo "docker=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          docker=false
          for file in $(git diff --name-only "$BASE_SHA" "$GITHUB_SHA"); do
            case "$file" in
              # Keep this list in step with what web/Dockerfile copies in and installs.
              web/Dockerfile|web/package.json|web/pnpm-lock.yaml|web/pnpm-workspace.yaml|.dockerignore|.github/workflows/ci.yml) docker=true ;;
            esac
          done
          echo "docker=$docker" >> "$GITHUB_OUTPUT"
          echo "Docker inputs changed: $docker"

  web:
    name: Typecheck, lint, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json   # uses the "packageManager" pnpm version
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm check   # typecheck + lint + build; the same command to run locally before every push
                          # (src/env.ts skips secret validation during next build)

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    needs: [web, changes]
    if: needs.changes.outputs.docker == 'true'   # skipped (not failed) when no Docker input changed
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: web/Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
